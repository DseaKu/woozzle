[package]
name = "woozzle"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
avian2d = "0.7.0"
bevy = "0.19.0"
bevy-inspector-egui = "0.37.0"
rand = "0.10.2"
strum = "0.28.0"
strum_macros = "0.28.0"

[features]
# Faster incremental builds while developing: cargo run --features dev
dev = ["bevy/dynamic_linking"]

[profile.dev.package."*"]
opt-level = 3
